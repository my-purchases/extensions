name: Extension CI

on:
  push:
    branches: [master]
    paths:
      - 'chrome/**'
  pull_request:
    branches: [master]
    paths:
      - 'chrome/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chrome
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chrome/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

      - name: Create extension zip
        run: |
          cd dist
          zip -r ../my-purchases-collector-${{ github.sha }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: my-purchases-collector
          path: chrome/my-purchases-collector-*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: my-purchases-collector

      - name: Rename zip for release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          mv my-purchases-collector-*.zip "my-purchases-collector-${VERSION}.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: my-purchases-collector-*.zip
          generate_release_notes: true
